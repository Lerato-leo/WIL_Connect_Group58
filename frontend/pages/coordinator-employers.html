<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employers · WIL Connect</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/layout.js" defer></script>
  <script src="../js/pages/coordinator-employers.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <!-- Employers: list of employers with Approve and Deactivate (Table 4.7.2, FR2) -->
    <main class="main" id="main" tabindex="-1">
      <div class="page-head">
        <div>
          <h1>Employers</h1>
          <p>Students can only find and request employers that you have approved.</p>
        </div>
      </div>

      <section class="card" aria-labelledby="pending-title">
        <div class="card-head">
          <div>
            <h2 id="pending-title">Waiting for approval</h2>
            <p>Check each company before you approve it.</p>
          </div>
        </div>
        <div id="pending"></div>
      </section>

      <section class="card" aria-labelledby="all-title">
        <div class="card-head"><h2 id="all-title">All employers</h2></div>
        <div id="all"></div>
      </section>
    </main>
  </div>
</body>
</html>
