
openapi: 3.0.3

info:
  title: WIL Connect API
  description: API for managing Work Integrated Learning placements and activities.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: User registration and authentication

paths:

  # ==========================================================
  # REGISTRATION
  # ==========================================================

  /api/auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a new account
      description: Creates a new student account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

        '400':
          description: Invalid registration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Email address already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ==========================================================
  # LOGIN
  # ==========================================================

  /api/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate a user
      description: Authenticates a registered user using their email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '400':
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # ========================================================
    # REGISTRATION MODELS
    # ========================================================

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john@gmail.com

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: SecurePass123!

        role:
          type: string
          enum:
            - STUDENT
            - SUPERVISOR
            - EMPLOYER
            - COORDINATOR
          example: STUDENT

        # The details of the role (4.6.2). The fields the role needs are required.
        firstName:
          type: string
          maxLength: 50
          example: John
        lastName:
          type: string
          maxLength: 50
          example: Smith
        studentNumber:
          type: string
          maxLength: 20
          example: "20240123"
        employerId:
          type: integer
          format: int32
          example: 1
        phone:
          type: string
          maxLength: 20
          example: "0821234567"
        pin:
          type: string
          format: password
          example: "1234"
        employerName:
          type: string
          maxLength: 100
          example: Nexus Tech Solutions
        address:
          type: string
          maxLength: 255
          example: 12 Rivonia Road, Sandton
        contactEmail:
          type: string
          format: email
          maxLength: 100
          example: hr@nexustech.co.za
        contactNumber:
          type: string
          maxLength: 20
          example: "0115550100"

    RegisterResponse:
      type: object
      required:
        - userId
        - email
        - role
        - message
      properties:
        userId:
          type: integer
          format: int32

        email:
          type: string
          format: email

        role:
          type: string
          enum:
            - STUDENT
            - SUPERVISOR
            - EMPLOYER
            - COORDINATOR
          example: STUDENT

        message:
          type: string
          example: Registration successful


    # ========================================================
    # LOGIN MODELS
    # ========================================================

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john@gmail.com

        password:
          type: string
          format: password
          example: SecurePass123!

    LoginResponse:
      type: object
      required:
        - userId
        - email
        - role
        - authenticated
        - message
      properties:
        userId:
          type: integer
          format: int32

        email:
          type: string
          format: email

        role:
          type: string
          enum:
            - STUDENT
            - SUPERVISOR
            - EMPLOYER
            - COORDINATOR
          example: STUDENT

        authenticated:
          type: boolean
          example: true

        message:
          type: string
          example: Login successful

        name:
          type: string
          description: The person's full name, or the company name for an employer
          example: John Smith


    # ========================================================
    # ERROR MODEL
    # ========================================================

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid email or password
