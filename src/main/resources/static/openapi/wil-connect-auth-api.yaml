
openapi: 3.0.3

info:
  title: WIL Connect API
  description: API for managing Work Integrated Learning placements and activities.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: User registration and authentication

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a new account
      description: Creates a new student account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '200':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

        '400':
          description: Invalid registration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Email address already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john@gmail.com

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: SecurePass123!

    RegisterResponse:
      type: object
      required:
        - userId
        - email
        - role
        - message
      properties:
        userId:
          type: integer
          format: int32

        email:
          type: string
          format: email

        role:
          type: string
          enum:
            - STUDENT
            - SUPERVISOR
            - EMPLOYER
            - COORDINATOR
          example: STUDENT

        message:
          type: string
          example: Registration successful

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Email address already exists
