spring.application.name=wil-connect

# =================================
# DATABASE CONFIGURATION
# =================================

spring.datasource.url=jdbc:mysql://localhost:3306/wil_connect
spring.datasource.username=root

#add your own strong password here
spring.datasource.password=YourNewStrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================
# JPA / HIBERNATE CONFIGURATION
# =================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =================================
# OPEN API
# =================================
springdoc.swagger-ui.url=/openapi/wil-connect-auth-api.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

# =================================
# Upload DIR and file sizes
# =================================
wil.upload.dir=uploads/proof
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB